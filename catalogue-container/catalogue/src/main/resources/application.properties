# This file contains Quarkus configuration

# HTTP configuration
quarkus.http.port=8380
quarkus.http.test-port=8381
# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=
%dev.quarkus.http.cors.origins=http://localhost:5175,https://gaia.ispatial.survey.ntua.gr,https://gaia.ispatial.survey.ntua.local
# Default security headers for API responses (see https://quarkus.io/guides/http-reference#additional-http-headers)
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Permissions-Policy".value=accelerometer=(), camera=(), geolocation=(), microphone=()
quarkus.http.header."X-Content-Type-Options".value=nosniff
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# Datasource configuration (see https://quarkus.io/guides/datasource-guide)
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
# The database connection properties must be set explicitly by the environment
quarkus.datasource.username=INVALID_USERNAME
quarkus.datasource.password=INVALID_PASSWORD
quarkus.datasource.reactive.url=INVALID_URL
quarkus.datasource.jdbc.url=INVALID_URL
quarkus.hibernate-orm.log.sql=false
# If we don't want Hibernate to validate the schema in dev mode
#quarkus.hibernate-orm.validate-in-dev-mode=false
# JSON columns are written by Hibernate's own mapper, not the ObjectMapper customized for the REST endpoints, so the
# stored form never changes with the wire format
# ref: https://quarkus.io/guides/hibernate-orm/#quarkus-hibernate-orm_quarkus-hibernate-orm-mapping-format-global
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.liquibase.change-log=db.changelog.xml
quarkus.liquibase.migrate-at-start=true
%dev.quarkus.liquibase.contexts=dev

# Data for the version endpoint
catalogue.version=@project.version@
catalogue.git-hash=@git.commit.id.abbrev@

# OpenAPI: machine-readable HTTP contract for API consumers, generated from the JAX-RS resources. Served by default at
# /q/openapi, overridden below; the build also writes it to the directory below so it can be handed to consumers.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# Every operation but the version is reached with a bearer token; the operations name this scheme, which is also what
# puts the Authorize button in the Swagger UI.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=A bearer JWT from the IDM: a Retailer's or the Catalogue Sync's service-account token, or an operator's token.
# Include the Swagger UI in production too
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/catalogue/v1/swagger
quarkus.swagger-ui.theme=flattop
quarkus.smallrye-openapi.path=/api/catalogue/v1/openapi

# Authentication: the access tokens the IDM issues to the Retailers' clients, to the Catalogue Sync and to the operators,
# meant for this service by the audience that the realm's client scope "catalogue" adds
quarkus.oidc.auth-server-url=http://localhost:8280/realms/tealhelix
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=catalogue
quarkus.oidc.token.required-claims.typ=Bearer
quarkus.keycloak.devservices.enabled=false
# The tests that need no real tokens run without the IDM; the ones that do, enable it with a Keycloak test resource
%test.quarkus.oidc.tenant-enabled=false

# The Feeds as received, one subdirectory per Catalogue; it must be set explicitly by the environment
%dev.catalogue.feed-store.directory=target/feed-store
%test.catalogue.feed-store.directory=target/feed-store
# Feeds are streamed to the store, never held in memory whole, so the limit is set by the largest Feed expected
quarkus.http.limits.max-body-size=2G
# The records of a Feed applied in one transaction
catalogue.ingestion.batch-size=500
# The tests' small Feeds span several batches
%test.catalogue.ingestion.batch-size=2
# A Snapshot that would take more than this share of its Catalogue's active Listings off sale is held for an operator
catalogue.ingestion.deactivation-hold-share=0.1
# The Product Changes read in one page if the Catalogue Sync names no limit, and the most it may name
catalogue.product-changes.default-limit=500
catalogue.product-changes.max-limit=1000
# The eviction, run at the times of the cron expression (Quartz format), forgets the products the Retailers stopped
# selling long ago: it deletes the Listings inactive and last seen longer ago than the listing threshold, makes the
# products left without Listings tombstones, and deletes the tombstones older than the purge period (ISO-8601 durations).
# The Catalogue Sync must never fall further behind than the purge period: a tombstone purged before the Sync read it
# never reaches HowiBuy, which then keeps the product for good.
catalogue.eviction.cron=0 30 3 * * ?
catalogue.eviction.listing-threshold=P90D
catalogue.eviction.tombstone-purge-period=P365D
# The tests run the eviction themselves
%test.catalogue.eviction.cron=off
