# This file contains Quarkus configuration

# The output of a command is its result
quarkus.banner.enabled=false

# The services the Product Changes are carried between
quarkus.rest-client.ingestion.url=http://localhost:8380
quarkus.rest-client.howibuy.url=http://localhost:8180
# HowiBuy's LLM classifies a product with up to three calls to Ollama, each of which it waits for up to its
# quarkus.langchain4j.ollama.productAssessment.timeout (180s)
quarkus.rest-client.howibuy.read-timeout=600000

# Authentication: the access token of the Catalogue Sync's service account in the IDM, sent to both services; the
# realm's client scope "catalogue" adds the audience the Ingestion requires
quarkus.oidc-client.auth-server-url=http://localhost:8280/realms/tealhelix
quarkus.oidc-client.client-id=catalogue-sync
# The token is requested when the first request is sent, so the command reaches the IDM only when it has work for it
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=protocol/openid-connect/token
quarkus.oidc-client.early-tokens-acquisition=false
# A token is renewed this long before it expires, so a request never carries one that expires on its way
quarkus.oidc-client.refresh-token-time-skew=30S
# The secret of the service account must be set explicitly by the environment
quarkus.oidc-client.credentials.secret=INVALID_SECRET

# The Product Changes read from the Ingestion and applied to HowiBuy in one page; the Ingestion reads at most its
# catalogue.product-changes.max-limit in one page
catalogue-sync.page-size=500

# The products a run of classify attempts, unless its --limit tells otherwise
catalogue-sync.classification.limit=100
# How many attempts classify starts in a minute at most, unless its --rate tells otherwise; when not set either, it
# starts each attempt as soon as the one before it ends
#catalogue-sync.classification.rate=
# The pending products read from HowiBuy in one page, unless the limit is lower; HowiBuy reads at most its
# ClassificationService.MAX_PER_PAGE in one page
catalogue-sync.classification.page-size=1000
