version: '3.5'
# see https://github.com/temporalio/docker-compose/blob/main/docker-compose-postgres.yml
services:
  postgresql:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    image: tealhelix-postgres:latest
    ports:
      - '5432:5432'
    volumes:
      - data_db:/var/lib/postgresql/data
  keycloak:
    image: 'tealhelix-keycloak:latest'
    ports:
      - "8280:8080"
    depends_on:
      - postgresql

volumes:
  data_db:
