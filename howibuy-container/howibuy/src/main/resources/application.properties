# This file contains Quarkus configuration

# HTTP configuration
quarkus.http.port=8180
quarkus.http.test-port=8181
# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=
%dev.quarkus.http.cors.origins=http://localhost:5175
# Default security headers for API responses (see https://quarkus.io/guides/http-reference#additional-http-headers)
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Permissions-Policy".value=accelerometer=(), camera=(), geolocation=(), microphone=()
quarkus.http.header."X-Content-Type-Options".value=nosniff
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# Datasource configuration (see https://quarkus.io/guides/datasource-guide)
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
# The database connection properties must be set explicitly by the environment
quarkus.datasource.username=INVALID_USERNAME
quarkus.datasource.password=INVALID_PASSWORD
quarkus.datasource.reactive.url=INVALID_URL
quarkus.datasource.jdbc.url=INVALID_URL
quarkus.hibernate-orm.log.sql=false
quarkus.liquibase.change-log=db.changelog.xml
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.contexts=appdata
%dev.quarkus.liquibase.contexts=@dev,appdata

# Configuration
config.jwk.url=http://localhost:8280/realms/tealhelix/protocol/openid-connect/certs
# Must name the same realm as config.jwk.url above; tokens declaring any other issuer are rejected
config.jwt.expectedIssuer=http://localhost:8280/realms/tealhelix
# Only tokens the IDM issued for a user to one of these clients are accepted; service accounts are not listed here,
# they are recognised by the retailer records of this application
config.jwt.allowedUserClients=howibuy
config.jwt.map.userName=preferred_username
config.jwt.map.userId=sub
config.jwt.map.clientId=client_id
config.jwt.map.email=email
# The following 2 "map" values are not used yet but might be useful in the future
config.jwt.map.givenName=given_name
config.jwt.map.familyName=family_name
config.jwt.secret=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
config.jwt.internalKeyId=howibuy:1
config.jwt.sessionTimeInSeconds=3600
# A session handed over from a retailer runs on short tokens that the single-page application renews on demand, and ends
# for good after the maximum below no matter how often it was renewed
config.jwt.handoff.sessionTimeInSeconds=900
config.jwt.handoff.maxSessionTimeInSeconds=28800

# Quarkus Langchain4J configuration - https://docs.quarkiverse.io/quarkus-langchain4j/dev/ollama-chat-model.html
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.ollama.base-url=http://localhost:11434
#
# Product Assessment
quarkus.langchain4j.ollama.productAssessment.base-url=http://localhost:11434
quarkus.langchain4j.ollama.productAssessment.timeout=180s
quarkus.langchain4j.ollama.productAssessment.chat-model.model-id=llama3.1:8b
#%dev.quarkus.langchain4j.ollama.productAssessment.log-requests=true
#%dev.quarkus.langchain4j.ollama.productAssessment.log-responses=true
quarkus.langchain4j.ollama.productAssessment.chat-model.temperature=0

%dev.quarkus.log.category."eu.tealhelix.howibuy.services.v1.impl.SingleProductAssessor".level=DEBUG

# Sustainable Food Compass
sfc.languages=en,el,nl,et,de
sfc.default-language=en
# How long a completed attempt's answers stay locked before the user may start a fresh attempt (ISO-8601 duration).
sfc.stability-window=P30D
# Estimated seconds to answer one question, used for the displayed completion-time estimate.
sfc.seconds-per-question=20
