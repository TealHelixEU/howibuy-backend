# Descriptions for the types this application puts on the wire but does not define for it: the domain model, shared
# with the rest of the code, and the JDK types it carries. Those modules are framework-free, so they hold no
# MicroProfile OpenAPI annotations — the same line StringValueTypeSchemaFilter exists to avoid crossing. SmallRye
# merges this document into the one it scans from the code, leaving everything scanned (types, formats, required-ness)
# in place and adding only the text below.
#
# The types defined for the wire — the DTOs and the request/response envelopes — carry their text as annotations
# instead, next to the code that produces them. Nothing here is resolved against the model at build time, so a rename
# would leave an entry hanging on a name that no longer exists; OpenApiContractTest sweeps for that.
#
openapi: 3.1.0
components:
  schemas:

    # ---- Product assessment -------------------------------------------------------------------------------------

    ProductAssessmentOutcome:
      description: >-
        What the assessment made of one product: whether the archetype product it is could be identified at all and,
        if it could, the better-scoring products that could be bought in its place.
      properties:
        productKey:
          description: The key the caller sent for the product, echoed so each outcome can be tied back to its product.
        type:
          description: Whether the assessment succeeded. The alternatives below carry something only when it did.
        failureReason:
          description: Why the product could not be identified, carried only when the type is `FAILURE_TO_IDENTIFY`.
        bestPersonalAlternative:
          description: >-
            The best alternative under this user's own weighting of the sustainability dimensions, as their compass
            records it.
        bestScientificAlternative:
          description: The best alternative under the scientific weighting of the dimensions, which is the same for every user.
        bestCombinedAlternative:
          description: The best alternative under a blend of the two weightings above.
        diagnostics:
          description: >-
            How the product was identified, for tracing an assessment rather than for showing to a shopper. Missing
            when the product is unknown.

    AlternativeForProduct:
      description: A product put forward to be bought in place of the one assessed, together with what it would gain.
      properties:
        type:
          description: >-
            What the alternative amounts to. `NO_SUGGESTION` carries nothing else, and only `SUGGESTION` carries a
            product.
        archetype:
          description: >-
            The archetype product being recommended — the same one the assessed product was matched to, when the type
            is `GOOD_ENOUGH`.
        referenceOverallScore:
          description: >-
            The overall score of the archetype the assessed product was matched to, measured under the criterion that
            chose this alternative — the user's own weights for the personal recommendation, the scientific ones for
            the scientific recommendation, and the blend of the two for the combined one.
        alternativeOverallScore:
          description: >-
            The overall score of the archetype recommended in its place, measured under that same criterion. The pair
            is what explains the recommendation, and it never falls below the reference.
        product:
          description: >-
            The product of the user's Catalogue that stands for the recommended archetype: the cheapest one actively
            listed in it.

    RecommendedArchetype:
      description: The archetype product an alternative recommends, and the SAFAD taxonomy path it sits in.
      properties:
        id:
          description: The archetype product.
        name:
          description: The name of the archetype product.
        l1Category:
          description: >-
            The top of the SAFAD taxonomy path the archetype sits in. A suggestion may well come from a different
            branch than the assessed product's own, since substitutability reaches across categories, so the path says
            what kind of food is being recommended.
        l2Category:
          description: The middle of that path.
        l3Category:
          description: The leaf of that path, the one the archetype hangs from.

    ListedProduct:
      description: A product of the retailer as the user finds it in their Catalogue, with that Catalogue's price.
      properties:
        productKey:
          description: The retailer's key of the product.
        name:
          description: The name of the product, in the language the request asked for when it has one in it.
        language:
          description: >-
            The language the name is in: the one the request asked for, or else the primary language of the Catalogue.
        price:
          description: The price of the product in the Catalogue, without trailing zeros.
          examples: [2.49]
        currency:
          description: The currency of the price.

    MatchDiagnostics:
      description: >-
        The path the matching of a product by the LLM actually took, in a classification or a preview of one: the SAFAD
        taxonomy it descended and the archetype it ended at. A level is null when the matching did not reach it, which
        is how a product matched to no archetype, or a malformed reply of the LLM, says how far it got.
      properties:
        l1Category:
          description: The top-level category the product was placed in.
        l2Category:
          description: The category below that one.
        l3Category:
          description: The leaf category the product was placed in.
        archetypeProduct:
          description: The name of the archetype product within that leaf that the product was matched to.

    ProductAssessmentOutcomeType:
      description: >-
        How an assessment ended. `SUCCESS` — it ran, and the outcome carries what it found. `FAILURE_TO_IDENTIFY` —
        the archetype product the product is could not be identified; the failure reason says why. `FAILURE_OTHER` —
        it failed for some other reason.

    IdentificationFailureReason:
      description: >-
        Why the archetype product a product is could not be identified. `UNKNOWN_PRODUCT` — the retailer of the
        Catalogue has no product with this key here. `NOT_CLASSIFIED` — the product is known but was never classified.
        `NO_MATCHING_ARCHETYPE` — the product was classified, and no archetype product matches it.

    IdentificationDiagnostics:
      description: >-
        How the archetype product a product is was identified: the retailer product found by the key, and its
        Classification. A field is missing when the identification did not get that far.
      properties:
        retailerProductId:
          description: The retailer product the key names.
        classifier:
          description: The classifier whose attempts decided the Classification of the product.
        needsReview:
          description: >-
            Whether the attempts the Classification was decided from disagree, so that one of us will look at it.
        pending:
          description: >-
            Whether the product waits to be classified again, because it changed since it was classified or its
            Classification was reopened. Until it is, the product is assessed as it was classified.
        archetypeProductId:
          description: The archetype product the product is.
        archetypeProductName:
          description: The name of the archetype product the product is.

    Classifier:
      description: >-
        Who decided a Classification. `MANUAL` — one of us. `EXPERT` — a domain source we trust but do not run.
        `LLM` — the language model of this application.

    AlternativeForProductType:
      description: >-
        What an alternative amounts to. `SUGGESTION` — a product that would improve on the one assessed.
        `GOOD_ENOUGH` — the assessed product is already good enough, so nothing is put forward in its place.
        `NO_SUGGESTION` — none could be produced.

    ArchetypeProductId:
      description: >-
        Names one archetype product: a leaf of the SAFAD taxonomy, the thing an assessed product is identified as and
        the key a recommended alternative is reported by.

    ProductKey:
      description: The retailer's own identifier for a product, carried through an assessment unchanged.

    RetailerProductId:
      description: Names one product of a retailer, as this application knows it.

    # ---- Sustainable Food Compass -------------------------------------------------------------------------------

    Progress:
      description: >-
        How far a user has got, reported both for the compass as a whole and for one category of it.
      properties:
        answered:
          description: How many of the questions have been answered.
          examples: [7]
        total:
          description: How many questions there are to answer.
          examples: [12]
        percentage:
          description: >-
            The answered share of the total, rounded to the nearest whole number. A set with no questions in it counts
            as 0.
          examples: [58]

    AttemptStatus:
      description: >-
        Where a compass attempt stands. It begins `IN_PROGRESS`, where answers may be given and changed freely, and
        moves once and irreversibly to `COMPLETED` when the user locks it in.

    ScaleOption:
      description: >-
        The fixed five-point scale every compass question is answered on — how much the user cares about what it asks
        — ordered from `NOT_IMPORTANT` to `EXTREMELY_IMPORTANT`. What a user is shown are the localized labels
        delivered with the question, not these names.

    SustainabilityDimension:
      description: The fixed set of sustainability dimensions the compass covers. Every category addresses exactly one of them.

    CategoryId:
      description: Names one category of the compass.

    QuestionId:
      description: Names one question of the compass.

    # ---- Carried from the JDK -----------------------------------------------------------------------------------

    Locale:
      description: A language, written as an IETF language tag.
      examples: [en, el]

    Currency:
      description: A currency, written as its three-letter ISO 4217 code.
      examples: [EUR]

    LocalDateTime:
      description: A date and time carrying no time zone or offset, in ISO-8601 form.

    UUID:
      description: A universally unique identifier, in the canonical 8-4-4-4-12 hexadecimal form.
